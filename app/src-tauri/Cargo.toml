[package]
name = "water-reminder"
version = "0.1.0"
description = "喝水提醒桌宠"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# 读取屏幕上所有窗口的位置，用来给桌宠找桌面空白处（不需要辅助功能授权）
# objc2-app-kit：给桌宠窗口设 FullScreenAuxiliary，否则别的 app 全屏时桌宠不渲染。
# 版本跟 tao 间接依赖的一致，不会重复编译。
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
