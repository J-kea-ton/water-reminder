<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>喝水统计</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none;}
  #win{width:100%;height:100%;background:#FBF7F0;border-radius:20px;display:flex;flex-direction:column;box-sizing:border-box;position:relative;}

  /* 顶栏：标题真正居中（三列网格，两侧等宽） */
  #hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 16px 10px;flex-shrink:0;}
  #hd .t{grid-column:2;text-align:center;font-size:19px;font-weight:800;color:#3D342E;}
  #back{grid-column:1;justify-self:start;display:flex;align-items:center;gap:3px;padding:6px 10px 6px 6px;border:none;background:transparent;border-radius:9999px;color:#0E7CBE;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  #back:hover{background:#E3F2FB;}

  #scroll{flex:1;overflow-y:auto;padding:0 18px 0;display:flex;flex-direction:column;}
  #content{display:flex;flex-direction:column;flex:1;min-height:0;}
  /* banner 用 margin auto：flex column 里剩余空间被 auto 双向吸收，banner 视觉居中 */
  #scroll::-webkit-scrollbar{width:6px;} #scroll::-webkit-scrollbar-thumb{background:#E7DECF;border-radius:3px;}

  /* 切换栏：两个等宽圆角卡片，选中底部蓝线 */
  #tabs{display:flex;gap:10px;margin-top:6px;}
  .tab{flex:1;position:relative;padding:13px 0;text-align:center;border:1px solid #E7DECF;border-radius:13px;background:#FEFCF8;color:#8A7E6E;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit;transition:color .18s,border-color .18s;}
  .tab:hover{border-color:#CFE3F0;}
  .tab.on{color:#0E7CBE;border-color:#BFDCEF;}
  .tab.on::after{content:'';position:absolute;left:20%;right:20%;bottom:-1px;height:3px;background:#0E7CBE;border-radius:2px;}

  /* 三张彩色数字卡 */
  #cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px;}
  .card{position:relative;border-radius:16px;padding:15px 6px 12px;text-align:center;}
  .card .ic{position:absolute;top:9px;right:9px;font-size:12px;line-height:1;}
  .card .v{font-size:22px;font-weight:800;line-height:1;}
  .card .v .u{font-size:12px;font-weight:600;margin-left:1px;opacity:.75;}
  .card .k{font-size:11px;margin-top:7px;}
  .card.blue{background:#E9F2FB;}   .card.blue .v{color:#2E7BB8;}   .card.blue .k{color:#7095B4;}
  .card.orange{background:#FBEDE0;} .card.orange .v{color:#DB8A3A;} .card.orange .k{color:#C2905F;}
  .card.green{background:#E8F4ED;}  .card.green .v{color:#3DA579;}  .card.green .k{color:#6EA88D;}

  /* 图表卡 */
  #chartCard{background:#FEFCF8;border:1px solid #EFE7D9;border-radius:18px;padding:15px 13px 8px;margin-top:18px;}
  .chartHd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  #chartTitle{font-size:14px;font-weight:700;color:#3D342E;}
  .goalTag{display:flex;align-items:center;gap:5px;font-size:11px;color:#C79A3B;white-space:nowrap;}
  .goalTag i{width:16px;border-top:2px dashed #E2A93B;}
  #chartSvg{width:100%;display:block;}

  /* 鼓励横幅 */
  #banner{margin:auto 0;display:flex;align-items:center;justify-content:center;gap:6px;background:#FBEEDD;color:#C77A2E;font-size:14px;font-weight:600;padding:12px 16px;border-radius:16px;text-align:center;line-height:1.4;}

  /* 空状态 */
  #empty{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:#A89C8E;}
  #empty .big{font-size:15px;color:#7A6E62;font-weight:600;margin-top:12px;}
  #empty .small{font-size:13px;margin-top:6px;line-height:1.5;}
</style>
</head>
<body>
<div id="win">
  <div id="hd" data-tauri-drag-region>
    <button id="back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>返回</button>
    <span class="t" data-tauri-drag-region>喝水统计</span>
  </div>

  <div id="scroll">
    <div id="content">
      <div id="tabs">
        <button class="tab on" data-view="7">近 7 天</button>
        <button class="tab" data-view="30">近 30 天</button>
      </div>

      <div id="cards">
        <div class="card blue"><span class="ic">💧</span><div class="v" id="cAvg">0<span class="u">ml</span></div><div class="k">日均</div></div>
        <div class="card orange"><span class="ic">🔥</span><div class="v" id="cStreak">0<span class="u">天</span></div><div class="k">连续达标</div></div>
        <div class="card green"><span class="ic">🎯</span><div class="v" id="cRate">0<span class="u">%</span></div><div class="k">达标率</div></div>
      </div>

      <div id="chartCard">
        <div class="chartHd">
          <span id="chartTitle">每天喝水量</span>
          <span class="goalTag"><i></i>目标 <span id="goalTxt">2000</span>ml</span>
        </div>
        <svg id="chartSvg" viewBox="0 0 304 292" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div id="banner"></div>
    </div>

    <div id="empty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#D8CDB8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="20" x2="7" y2="13"/><line x1="12" y1="20" x2="12" y2="9"/><line x1="17" y1="20" x2="17" y2="15"/></svg>
      <div class="big">还没有喝水记录</div>
      <div class="small">回去喝一杯，这里就会长出你的<br>喝水曲线啦</div>
    </div>
  </div>
</div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = id => document.getElementById(id);

  let points = [];   // 后端给的最近 30 个连续点，oldest→newest
  let view = 7;

  const WEEK = ['日','一','二','三','四','五','六'];
  function weekdayLabel(dateStr, isToday){
    if(isToday) return '今天';
    const [y,m,d] = dateStr.split('-').map(Number);
    return WEEK[new Date(y, m-1, d).getDay()];
  }

  // ===== 统计计算 =====
  function metOf(p){ return p.goalMl > 0 && p.totalMl >= p.goalMl; }
  function avgMl(v){
    const vp = points.slice(-v).filter(p => p.totalMl > 0);
    if(!vp.length) return 0;
    return Math.round(vp.reduce((a,p)=> a + p.totalMl, 0) / vp.length);
  }
  function streakDays(){
    let s = 0;
    for(let i = points.length - 1; i >= 0; i--){
      const p = points[i];
      if(p.isToday && !metOf(p)) continue;   // 今天还没达标不算断，从昨天起算
      if(metOf(p)) s++; else break;
    }
    return s;
  }
  function rate(v){
    const vp = points.slice(-v);
    if(!vp.length) return 0;
    return Math.round(vp.filter(metOf).length / vp.length * 100);
  }

  // ===== 图表 =====
  const PX0=8, PX1=296, PW=288, PY_TOP=16, PY_BOT=256, PH=236, YLAB=280;
  const SVG='http://www.w3.org/2000/svg';
  function el(name, attrs, text){ const e=document.createElementNS(SVG,name); for(const k in attrs) e.setAttribute(k, attrs[k]); if(text!=null) e.textContent=text; return e; }

  function scaleOf(vp){
    const goal = vp.length ? vp[vp.length-1].goalMl : 2000;
    const maxTotal = Math.max(0, ...vp.map(p=>p.totalMl));
    return { goal, maxVal: Math.max(goal, maxTotal, 1) };
  }
  function yOf(val, maxVal){ return PY_BOT - (val / maxVal) * PH * 0.92; }

  function goalLine(svg, goal, maxVal){
    const gy = yOf(goal, maxVal);
    svg.appendChild(el('line',{x1:PX0,y1:gy,x2:PX1,y2:gy,stroke:'#E2A93B','stroke-width':1.5,'stroke-dasharray':'4 4',opacity:.75}));
  }

  function renderBars(vp){
    const svg=$('chartSvg'); svg.innerHTML='';
    const {goal, maxVal}=scaleOf(vp);
    goalLine(svg, goal, maxVal);
    const slot=PW/vp.length, barW=Math.min(30, slot*0.6);
    vp.forEach((p,i)=>{
      const cx=PX0 + i*slot + slot/2, x=cx-barW/2;
      let fill, h;
      if(p.totalMl===0){ fill='#E4DAC8'; h=5; }
      else { fill = metOf(p) ? '#63C08D' : '#9AC8EA'; h=Math.max(6, PY_BOT-yOf(p.totalMl,maxVal)); }
      const y=PY_BOT-h;
      const rect=el('rect',{x,y,width:barW,height:h,rx:6,fill});
      if(p.isToday){ rect.setAttribute('stroke','#3F7BB5'); rect.setAttribute('stroke-width','2.5'); }
      svg.appendChild(rect);
      svg.appendChild(el('text',{x:cx,y:YLAB,'text-anchor':'middle','font-size':12,
        fill:p.isToday?'#0E7CBE':'#A89C8E','font-weight':p.isToday?700:400}, weekdayLabel(p.date,p.isToday)));
    });
    svg.appendChild(el('line',{x1:PX0,y1:PY_BOT,x2:PX1,y2:PY_BOT,stroke:'#EFE7D9','stroke-width':1}));
  }

  function smoothPath(pts){
    if(pts.length<2) return '';
    let d='M'+pts[0].x+' '+pts[0].y;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
      const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
      d+=' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y;
    }
    return d;
  }

  function renderLine(vp){
    const svg=$('chartSvg'); svg.innerHTML='';
    const {goal, maxVal}=scaleOf(vp);
    const n=vp.length;
    const pts=vp.map((p,i)=>({x:PX0 + (n>1 ? i*(PW/(n-1)) : PW/2), y:yOf(p.totalMl,maxVal), p}));
    const line=smoothPath(pts);
    const grad=el('linearGradient',{id:'lg',x1:0,y1:0,x2:0,y2:1});
    grad.appendChild(el('stop',{offset:0,'stop-color':'#3E92CE','stop-opacity':.20}));
    grad.appendChild(el('stop',{offset:1,'stop-color':'#3E92CE','stop-opacity':0}));
    const defs=el('defs',{}); defs.appendChild(grad); svg.appendChild(defs);
    svg.appendChild(el('path',{d:line+' L'+pts[n-1].x+' '+PY_BOT+' L'+pts[0].x+' '+PY_BOT+' Z',fill:'url(#lg)'}));
    goalLine(svg, goal, maxVal);
    svg.appendChild(el('path',{d:line,fill:'none',stroke:'#3E92CE','stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'}));
    // 达标的天在曲线上点个绿点
    pts.forEach(pt=>{ if(metOf(pt.p) && !pt.p.isToday) svg.appendChild(el('circle',{cx:pt.x,cy:pt.y,r:2.6,fill:'#63C08D'})); });
    // 今天：空心蓝圆
    const last=pts[n-1];
    svg.appendChild(el('circle',{cx:last.x,cy:last.y,r:4.5,fill:'#FEFCF8',stroke:'#3E92CE','stroke-width':2.4}));
    svg.appendChild(el('line',{x1:PX0,y1:PY_BOT,x2:PX1,y2:PY_BOT,stroke:'#EFE7D9','stroke-width':1}));
    svg.appendChild(el('text',{x:PX0,y:YLAB,'text-anchor':'start','font-size':11,fill:'#A89C8E'},'30 天前'));
    svg.appendChild(el('text',{x:(PX0+PX1)/2,y:YLAB,'text-anchor':'middle','font-size':11,fill:'#A89C8E'},'15 天前'));
    svg.appendChild(el('text',{x:PX1,y:YLAB,'text-anchor':'end','font-size':11,fill:'#0E7CBE','font-weight':600},'今天'));
  }

  function render(){
    const hasData = points.some(p=>p.totalMl>0);
    $('content').style.display = hasData ? 'block' : 'none';
    $('empty').style.display = hasData ? 'none' : 'flex';
    if(!hasData) return;

    $('cAvg').innerHTML   = avgMl(view) + '<span class="u">ml</span>';
    $('cStreak').innerHTML= streakDays() + '<span class="u">天</span>';
    $('cRate').innerHTML  = rate(view) + '<span class="u">%</span>';

    const vp = points.slice(-view);
    $('chartTitle').textContent = view===7 ? '每天喝水量' : '近 30 天走势';
    $('goalTxt').textContent = vp.length ? vp[vp.length-1].goalMl : 2000;
    if(view===7) renderBars(vp); else renderLine(vp);

    const s = streakDays();
    $('banner').textContent = s>=1
      ? '🔥 已经连续 ' + s + ' 天喝够啦，保持住～'
      : '💧 今天先喝够一天，开启连续记录';
  }

  document.querySelectorAll('.tab').forEach(t=> t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    view=+t.dataset.view;
    render();
  }));

  $('back').addEventListener('click',()=>
    invoke('switch_window',{from:'stats',to:'main'}));

  async function load(){
    try{ points = await invoke('get_stats') || []; }
    catch(e){ points = []; }
    render();
  }
  listen('updated', ()=> load());
  load();
</script>
</body>
</html>
